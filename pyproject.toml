[project]
name = "sierra-pass-report"
version = "0.1.0"
description = "Snowline: West Coast mountain pass conditions from snow sensors and stream gauges, with forecasts, fire, road and avalanche reports alongside"
requires-python = ">=3.12"
dependencies = ["requests>=2.31", "urllib3>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# The extraction prompt reads best as long natural-language lines.
"extraction/extractor.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
