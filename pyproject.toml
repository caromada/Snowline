[project]
name = "sierra-pass-report"
version = "0.1.0"
description = "Fusion engine for Sierra Nevada pass conditions: sensors + satellite + LLM-read trip reports"
requires-python = ">=3.12"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
