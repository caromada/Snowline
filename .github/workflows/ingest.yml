name: daily-ingest

on:
  schedule:
    # 14:00 UTC = early morning in the Sierra, after the overnight sensor writes.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      # The branch as it stands when the job starts, not as it stood when the
      # run was queued: an earlier run may have pushed its export since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "requests>=2.31" "urllib3>=2.3"

      - name: Cache keys
        id: keys
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          # Only what shapes the sensor rows. Forecast, satellite and forum
          # code live in ingest/ too, and must not wipe the store.
          echo "code=${{ hashFiles('gazetteer/passes.json', 'ingest/snotel.py', 'ingest/cdec.py', 'ingest/usgs.py', 'ingest/directory.py', 'ingest/geo.py', 'store/**', 'scripts/backfill.py') }}" >> "$GITHUB_OUTPUT"

      # The HTTP cache is what "cached fallback" falls back to. Without it
      # every run starts cold and one slow upstream kills the job.
      - name: Restore HTTP cache
        uses: actions/cache/restore@v6
        with:
          path: data/cache
          key: http-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: http-v1-

      # The store carries over between runs so a normal day only fetches the
      # trailing window. It rebuilds from scratch monthly (picking up USGS
      # provisional-data revisions) and whenever sensor ingest code or passes
      # change. rebuild_pending.json rides along: it names the windows an
      # interrupted rebuild still owes.
      - name: Restore sensor store
        uses: actions/cache/restore@v6
        with:
          path: |
            data/sierra.sqlite
            data/rebuild_pending.json
          key: store-v1-${{ steps.keys.outputs.code }}-${{ steps.keys.outputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: store-v1-${{ steps.keys.outputs.code }}-${{ steps.keys.outputs.month }}-

      - name: Prune stale HTTP cache
        run: mkdir -p data/cache && find data/cache -type f -mtime +45 -delete

      - name: Ingest sensor data
        run: python -m scripts.backfill --daily

      # Forecasts degrade independently: if the NWS is down, passes simply
      # show no forecast today.
      - name: Fetch NWS forecasts
        run: python -m ingest.nws || echo "::warning::NWS forecasts unavailable today"

      # Fire perimeters and smoke degrade the same way: on an outage no
      # facts are written, and the map file keeps its old date, which the
      # app stops drawing once it is more than a day old.
      - name: Fetch fire perimeters and smoke
        run: python -m ingest.fire || echo "::warning::Fire and smoke data unavailable today"

      # Avalanche ratings, new snow and road status. Each source inside
      # degrades alone; Washington and Oregon roads wait on their keys.
      - name: Fetch winter conditions
        env:
          WSDOT_ACCESS_CODE: ${{ secrets.WSDOT_ACCESS_CODE }}
          TRIPCHECK_API_KEY: ${{ secrets.TRIPCHECK_API_KEY }}
        run: python -m ingest.winter || echo "::warning::Winter conditions unavailable today"

      # What rangers and road crews published, quoted as written. Each page
      # degrades alone; park alerts wait on their key.
      - name: Fetch official reports
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: python -m ingest.official || echo "::warning::Official reports unavailable today"

      - name: Save HTTP cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/cache
          key: http-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # Saved even when the ingest failed, so a rebuild that lost one stream
      # keeps the other twelve minutes of work and resumes next run.
      - name: Save sensor store
        if: always() && hashFiles('data/sierra.sqlite') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            data/sierra.sqlite
            data/rebuild_pending.json
          key: store-v1-${{ steps.keys.outputs.code }}-${{ steps.keys.outputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Extract any new forum posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BUDGET_USD: "1.00"
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "no API key configured; skipping extraction"
          else
            python -m scripts.extract_corpus --engine api
          fi
      - name: Fuse and export
        run: python pipeline.py
      # The public scorecard. It reads the store the export just used and
      # must never fail the run: on any error the page keeps yesterday's
      # numbers and the date they were computed.
      - name: Backtest the verdicts
        run: python -m eval.verdict_backtest --store data/sierra.sqlite || echo "::warning::Verdict backtest failed; the scorecard keeps its last numbers"
      - name: Commit refreshed exports
        run: |
          git config user.name "sierra-pass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data data/extractions data/stations eval/verdict_results.json
          git diff --cached --quiet || git commit -m "Daily ingest $(date -u +%F)"
          # The export is regenerated whole every run, so if someone pushed
          # exported files in the meantime, this run's fresher copy wins.
          # In a rebase "theirs" is the commit being replayed: this one.
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          git rebase --quiet -X theirs "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
