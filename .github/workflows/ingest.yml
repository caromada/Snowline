name: daily-ingest

on:
  schedule:
    # 14:00 UTC = early morning in the Sierra, after the overnight sensor writes.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      # The SQLite store is not committed; every run rebuilds it from the
      # live APIs (all melt seasons 2023 through today).
      - name: Ingest sensor data
        run: python -m scripts.backfill
      - name: Extract any new forum posts
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BUDGET_USD: "1.00"
        run: python -m scripts.extract_corpus --engine api
      - name: Fuse and export
        run: python pipeline.py
      - name: Commit refreshed exports
        run: |
          git config user.name "sierra-pass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data data/extractions
          git diff --cached --quiet || git commit -m "Daily ingest $(date -u +%F)"
          git push
